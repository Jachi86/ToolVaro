<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Varo a J - Catenaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { background-color: white; border-radius: 8px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4 text-gray-800">

    <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold mb-2 text-blue-800">Analisi Varo a J (J-Lay)</h1>
        <p class="mb-4 text-sm text-gray-600">Catenaria con calcolo automatico dei pesi, Stress e Strain al TDP (Input in Tons).</p>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Pannello Inputs -->
            <div class="bg-white p-4 rounded-lg shadow col-span-1 flex flex-col gap-4">
                
                <!-- Geometria, Materiale e Densità -->
                <div>
                    <h2 class="text-lg font-semibold mb-2 border-b pb-1">1. Tubo, Materiale e Densità</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">OD [mm]</label>
                            <input type="number" id="pipeOD" value="323.9" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">WT [mm]</label>
                            <input type="number" id="pipeWT" value="12.7" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Modulo E [GPa]</label>
                            <input type="number" id="pipeE" value="207" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Snervamento [MPa]</label>
                            <input type="number" id="pipeYield" value="450" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 border-t pt-2 mt-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Densità Acciaio [kg/m³]</label>
                            <input type="number" id="densSteel" value="7850" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Densità Acqua [kg/m³]</label>
                            <input type="number" id="densWater" value="1025" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="block text-xs font-medium text-blue-700">Condizione Tubo</label>
                        <select id="pipeCondition" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm bg-blue-50 focus:ring-blue-500 focus:border-blue-500">
                            <option value="empty">Empty (Vuoto)</option>
                            <option value="flooded">Flooded (Allagato)</option>
                        </select>
                    </div>
                </div>

                <!-- Parametri Varo -->
                <div>
                    <h2 class="text-lg font-semibold mb-2 border-b pb-1">2. Parametri di Varo</h2>
                    <div class="mb-2">
                        <label class="block text-xs font-medium text-blue-700">Modalità di Calcolo</label>
                        <select id="calcMode" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm bg-blue-50 focus:ring-blue-500 focus:border-blue-500" onchange="updateInputFields()">
                            <option value="1">Water Depth + Residual Lay Tension</option>
                            <option value="2">Water Depth + Top Tension</option>
                            <option value="3">Water Depth + Angolo Top</option>
                        </select>
                    </div>

                    <div class="mb-2">
                        <label class="block text-xs font-medium text-gray-700">Water Depth (d) [m]</label>
                        <input type="number" id="waterDepth" value="1000" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm">
                    </div>
                    
                    <div class="mb-3" id="divParam2">
                        <label id="lblParam2" class="block text-xs font-medium text-gray-700">Residual Lay Tension (H) [t]</label>
                        <input type="number" id="param2" value="15" class="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm">
                    </div>

                    <button onclick="calculateAndPlot()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition duration-200 mt-2 shadow">
                        Calcola & Disegna
                    </button>
                </div>
            </div>

            <!-- Pannello Grafico e Risultati -->
            <div class="col-span-1 lg:col-span-2 flex flex-col gap-4">
                <!-- Risultati Pesi e Geometria Base -->
                <div class="bg-white p-4 rounded-lg shadow border-t-4 border-blue-500">
                    <h2 class="text-md font-semibold mb-2">Proprietà Lineari Calcolate</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs" id="weightsContainer">
                        <!-- Popolato dal JS -->
                    </div>
                </div>

                <!-- Risultati Numerici Varo -->
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="text-md font-semibold mb-2 border-b pb-1 flex justify-between items-center">
                        Risultati Configurazione 
                        <span id="statusBadge" class="text-[10px] px-2 py-1 rounded-full font-bold uppercase text-white"></span>
                    </h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs" id="resultsContainer">
                        <!-- Popolato dal JS -->
                    </div>
                </div>

                <!-- Grafico -->
                <div class="relative w-full h-[400px]">
                    <canvas id="catenaryChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartInstance = null;
        const g = 9.81; 

        function updateInputFields() {
            const mode = document.getElementById('calcMode').value;
            const lbl = document.getElementById('lblParam2');
            const param2 = document.getElementById('param2');
            
            if (mode === "1") {
                lbl.innerText = "Residual Lay Tension (H) [t]";
                param2.value = "15";
            } else if (mode === "2") {
                lbl.innerText = "Tiro Superiore (Top Tension) [t]";
                param2.value = "75"; 
            } else if (mode === "3") {
                lbl.innerText = "Angolo al top (rispetto orizzontale) [°]";
                param2.value = "85"; 
            }
        }

        function calculateAndPlot() {
            const OD_mm = parseFloat(document.getElementById('pipeOD').value);
            const WT_mm = parseFloat(document.getElementById('pipeWT').value);
            const E_GPa = parseFloat(document.getElementById('pipeE').value);
            const yield_MPa = parseFloat(document.getElementById('pipeYield').value);
            
            const rho_s = parseFloat(document.getElementById('densSteel').value);
            const rho_w = parseFloat(document.getElementById('densWater').value);
            const pipeCondition = document.getElementById('pipeCondition').value;

            const mode = document.getElementById('calcMode').value;
            const d = parseFloat(document.getElementById('waterDepth').value);
            const p2 = parseFloat(document.getElementById('param2').value);

            if (OD_mm <= 0 || WT_mm <= 0 || E_GPa <= 0 || rho_s <= 0 || rho_w <= 0 || d <= 0 || p2 <= 0) {
                alert("Si prega di inserire valori maggiori di zero.");
                return;
            }

            const OD = OD_mm / 1000; 
            const WT = WT_mm / 1000; 
            const ID = OD - 2 * WT;
            if (ID <= 0) {
                alert("Spessore troppo elevato per il diametro inserito.");
                return;
            }

            const E = E_GPa * 1e9; 
            const I = (Math.PI / 64) * (Math.pow(OD, 4) - Math.pow(ID, 4));
            const EI = E * I;

            const A_steel = (Math.PI / 4) * (Math.pow(OD, 2) - Math.pow(ID, 2));
            const A_int = (Math.PI / 4) * Math.pow(ID, 2);
            const A_ext = (Math.PI / 4) * Math.pow(OD, 2);

            const weight_air_N = A_steel * rho_s * g;
            const buoyancy_N = A_ext * rho_w * g;
            const water_int_weight_N = A_int * rho_w * g;

            const weight_sub_empty = weight_air_N - buoyancy_N;
            const weight_sub_flooded = weight_air_N + water_int_weight_N - buoyancy_N;

            let w = (pipeCondition === 'empty') ? weight_sub_empty : weight_sub_flooded;

            document.getElementById('weightsContainer').innerHTML = `
                <div><span class="text-gray-500 uppercase">Aria</span><br><span class="text-sm font-semibold text-gray-800">${(weight_air_N/g).toFixed(1)} kg/m</span></div>
                <div><span class="text-gray-500 uppercase">Galleggiamento</span><br><span class="text-sm font-semibold text-gray-800">${(buoyancy_N/g).toFixed(1)} kg/m</span></div>
                <div><span class="text-gray-500 uppercase">Sub (Empty)</span><br><span class="text-sm font-semibold ${weight_sub_empty < 0 ? 'text-red-500' : 'text-gray-800'}">${(weight_sub_empty/g).toFixed(1)} kg/m</span></div>
                <div><span class="text-gray-500 uppercase">Sub (Flooded)</span><br><span class="text-sm font-semibold text-gray-800">${(weight_sub_flooded/g).toFixed(1)} kg/m</span></div>
            `;

            if (w <= 0) {
                alert("Errore: Il tubo galleggia! Peso sommerso negativo o nullo.");
                return;
            }

            let H, Ttop, topAngleRad, s, x_layback;

            if (mode === "1") {
                H = p2 * 1000 * g; 
                Ttop = H + w * d;
            } else if (mode === "2") {
                Ttop = p2 * 1000 * g; 
                H = Ttop - w * d;
                if (H <= 0) {
                    alert("Errore: Tiro superiore minore del peso sospeso.");
                    return;
                }
            } else if (mode === "3") {
                let thetaDeg = p2;
                if (thetaDeg >= 90 || thetaDeg <= 0) return;
                topAngleRad = thetaDeg * Math.PI / 180;
                H = (w * d * Math.cos(topAngleRad)) / (1 - Math.cos(topAngleRad));
                Ttop = H + w * d;
            }

            s = Math.sqrt(d * (d + 2 * H / w));
            x_layback = (H / w) * Math.acosh((w * d / H) + 1);
            topAngleRad = Math.acos(H / Ttop);
            let topAngleDeg = topAngleRad * 180 / Math.PI;

            let R_tdp = H / w; 

            let max_strain = (OD / 2) / R_tdp; 
            let max_strain_perc = max_strain * 100; 
            let max_stress_Pa = E * max_strain;
            let max_stress_MPa = max_stress_Pa / 1e6;

            let isSafe = max_stress_MPa < yield_MPa;
            let statusBadge = document.getElementById('statusBadge');
            if (isSafe) {
                statusBadge.innerText = "SAFE";
                statusBadge.className = "text-[10px] px-2 py-1 rounded font-bold uppercase text-white bg-green-500";
            } else {
                statusBadge.innerText = "WARNING (Snervamento!)";
                statusBadge.className = "text-[10px] px-2 py-1 rounded font-bold uppercase text-white bg-red-600 animate-pulse";
            }

            let H_tons = H / (1000 * g);
            let Ttop_tons = Ttop / (1000 * g);

            const resHTML = `
                <div><span class="text-gray-500 uppercase">EI</span><br><span class="text-sm font-semibold text-gray-800">${(EI/1e6).toFixed(2)} MN·m²</span></div>
                <div><span class="text-gray-500 uppercase">Peso uso</span><br><span class="text-sm font-semibold text-blue-700">${(w).toFixed(1)} N/m</span></div>
                <div><span class="text-gray-500 uppercase">Res. Tension</span><br><span class="text-sm font-semibold text-blue-700">${H_tons.toFixed(1)} t</span></div>
                <div><span class="text-gray-500 uppercase">Top Tension</span><br><span class="text-sm font-semibold text-blue-700">${Ttop_tons.toFixed(1)} t</span></div>
                
                <div><span class="text-gray-500 uppercase">Angolo Top</span><br><span class="text-sm font-semibold text-blue-700">${topAngleDeg.toFixed(1)} °</span></div>
                <div><span class="text-gray-500 uppercase">Layspan</span><br><span class="text-sm font-semibold text-gray-800">${s.toFixed(1)} m</span></div>
                <div><span class="text-gray-500 uppercase">Layback</span><br><span class="text-sm font-semibold text-gray-800">${x_layback.toFixed(1)} m</span></div>
                
                <div class="col-span-1 md:col-span-4 bg-gray-50 p-2 rounded border ${isSafe ? 'border-green-200' : 'border-red-300'}">
                    <span class="text-gray-500 uppercase">TDP (Raggio | Strain | Stress)</span><br>
                    <span class="text-sm font-semibold ${isSafe ? 'text-green-700' : 'text-red-600'}">
                        R = ${R_tdp.toFixed(1)} m &nbsp;|&nbsp; 
                        e = ${max_strain_perc.toFixed(3)} % &nbsp;|&nbsp; 
                        s = ${max_stress_MPa.toFixed(1)} MPa
                    </span>
                </div>
            `;
            document.getElementById('resultsContainer').innerHTML = resHTML;

            if (H < 1) return;

            let plotData = [];
            let numPoints = 100;
            for (let i = 0; i <= numPoints; i++) {
                let x_math = (i / numPoints) * x_layback;
                let y_math = (H / w) * (Math.cosh(w * x_math / H) - 1);
                
                let curr_x = x_math; 
                let curr_y = d - y_math; 
                plotData.push({ x: curr_x, y: curr_y });
            }

            drawChart(plotData, d, x_layback);
        }

        function drawChart(data, depth, layback) {
            const ctx = document.getElementById('catenaryChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Configurazione Tubo (J-Lay)',
                        data: data,
                        borderColor: '#2563eb', 
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) { return `X: ${context.parsed.x.toFixed(1)}m, Y: ${context.parsed.y.toFixed(1)}m`; } } } },
                    scales: {
                        x: { type: 'linear', position: 'bottom', title: { display: true, text: 'Layback [m]', font:{weight: 'bold', size: 10} }, grid: { color: '#e5e7eb' } },
                        y: { type: 'linear', reverse: true, title: { display: true, text: 'Water Depth [m]', font:{weight: 'bold', size: 10} }, min: 0, max: Math.ceil(depth * 1.1), grid: { color: '#e5e7eb' } }
                    }
                }
            });
        }

        window.onload = () => { calculateAndPlot(); };
    </script>
</body>
</html>
